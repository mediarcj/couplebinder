# nginx/default.conf

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name detechify.com app.detechify.com _;
    return 301 https://$host$request_uri;
}

# HTTPS origin for Cloudflare
server {
    listen 443 ssl;
    http2 on;  # replaces deprecated "listen ... http2"

    server_name detechify.com app.detechify.com _;

    # Cloudflare Origin certs (already in ./certs and mounted read-only)
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Basic hardening
    server_tokens off;

    # Docker DNS for upstream name resolution
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Health paths (Cloudflare WAF allows these only with your secret header)
    location /health/ {
        proxy_pass http://app:3000;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # Everything else → app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_read_timeout 60s;
    }
}