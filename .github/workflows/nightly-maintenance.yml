name: Nightly Maintenance

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (no actual changes)"
        required: false
        default: false
        type: boolean

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      # Supabase secrets required by the script
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Optional: Redis URL if your utils read it
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20 + cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        working-directory: server
        run: npm ci

      - name: Run maintenance tasks
        working-directory: server
        env:
          DRY_RUN: ${{ env.DRY_RUN }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          REDIS_URL: ${{ env.REDIS_URL }}
        run: |
          node -e "
          const { supabaseAdmin } = require('./utils/supabaseClient');
          async function run() {
            console.log('Starting nightly maintenance tasks...');
            console.log('Dry run mode:', process.env.DRY_RUN === 'true');

            // 1) Outbox > 7 days
            const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
            if (process.env.DRY_RUN === 'true') {
              const { count, error } = await supabaseAdmin
                .from('outbox_events')
                .select('*', { count: 'exact', head: true })
                .lt('created_at', sevenDaysAgo);
              if (error) throw error;
              console.log('Would delete', count, 'old outbox events');
            } else {
              const { error } = await supabaseAdmin
                .from('outbox_events')
                .delete()
                .lt('created_at', sevenDaysAgo);
              if (error) throw error;
              console.log('Deleted old outbox events');
            }

            // 2) Idempotency keys > 24h
            const oneDayAgo = new Date(Date.now() - 24*60*60*1000).toISOString();
            if (process.env.DRY_RUN === 'true') {
              const { count, error } = await supabaseAdmin
                .from('idempotency_keys')
                .select('*', { count: 'exact', head: true })
                .lt('created_at', oneDayAgo);
              if (error) throw error;
              console.log('Would delete', count, 'old idempotency keys');
            } else {
              const { error } = await supabaseAdmin
                .from('idempotency_keys')
                .delete()
                .lt('created_at', oneDayAgo);
              if (error) throw error;
              console.log('Deleted old idempotency keys');
            }

            // 3) Audit logs > 30 days
            const thirtyDaysAgo = new Date(Date.now() - 30*24*60*60*1000).toISOString();
            if (process.env.DRY_RUN === 'true') {
              const { count, error } = await supabaseAdmin
                .from('audit_logs')
                .select('*', { count: 'exact', head: true })
                .lt('created_at', thirtyDaysAgo);
              if (error) throw error;
              console.log('Would delete', count, 'old audit logs');
            } else {
              const { error } = await supabaseAdmin
                .from('audit_logs')
                .delete()
                .lt('created_at', thirtyDaysAgo);
              if (error) throw error;
              console.log('Deleted old audit logs');
            }

            // 4) Simple stats
            const { count: totalUsers } = await supabaseAdmin
              .from('profiles')
              .select('*', { count: 'exact', head: true });
            console.log('Total users:', totalUsers);

            console.log('Nightly maintenance completed successfully');
          }
          run().catch(err => { console.error(err); process.exit(1); });
          "

      - name: Create maintenance report
        if: always()
        run: |
          echo "## Nightly Maintenance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Mode: ${{ env.DRY_RUN == 'true' && 'Dry Run' || 'Production' }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    needs: maintenance
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Use Node 20 + cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        working-directory: server
        run: npm ci

      - name: Run security audit
        working-directory: server
        run: npm audit --audit-level=moderate

      - name: Collect audit JSON
        working-directory: server
        run: npm audit --json > audit-results.json

      - name: Check for high/critical vulnerabilities
        working-directory: server
        run: |
          HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          echo "High: $HIGH_VULNS"
          echo "Critical: $CRITICAL_VULNS"
          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "Security vulnerabilities detected"
            exit 1
          fi

      - name: Create security report
        if: always()
        run: |
          echo "## Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f server/audit-results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Summary from npm audit (server/audit-results.json):" >> $GITHUB_STEP_SUMMARY
            jq '.metadata.vulnerabilities' server/audit-results.json >> $GITHUB_STEP_SUMMARY
          fi