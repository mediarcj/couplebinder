name: Build and Deploy to Prod

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20 + cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint --if-present

      - name: Tests (unit and security)
        working-directory: server
        run: |
          npm test --if-present -- --run
          npm run test:security --if-present

  deploy:
    runs-on: ubuntu-latest
    needs: security-tests
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.ECR_REPO }}
      SSM_IMAGE_TAG_PARAM: ${{ secrets.SSM_IMAGE_TAG_PARAM }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME }}
      IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20 + cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint --if-present

      - name: Tests
        working-directory: server
        run: npm test --if-present -- --run
        env:
          NODE_ENV: test

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug AWS identity & region
        run: |
          set -euxo pipefail
          aws --version
          aws sts get-caller-identity
          echo "Region=${AWS_REGION}"
          echo "Account=${AWS_ACCOUNT_ID}"
          echo "Repo=${ECR_REPO}"
          echo "Param=${SSM_IMAGE_TAG_PARAM}"
          echo "Instance=${INSTANCE_ID}"

      - name: Ensure ECR repo exists (idempotent)
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "${ECR_REPO}" >/dev/null
            echo "Created ECR repo ${ECR_REPO}"
          else
            echo "ECR repo ${ECR_REPO} exists"
          fi

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        run: |
          set -euxo pipefail
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}"
          docker build --platform linux/amd64 \
            -f server/Dockerfile \
            -t "${IMAGE_URI}" ./server
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Write new tag to SSM
        run: |
          set -euxo pipefail
          aws ssm put-parameter \
            --name "${SSM_IMAGE_TAG_PARAM}" \
            --type SecureString \
            --value "${IMAGE_TAG}" \
            --overwrite
          echo "Wrote IMAGE_TAG=${IMAGE_TAG} to ${SSM_IMAGE_TAG_PARAM}"

      - name: Restart service via SSM and wait
        run: |
          set -euxo pipefail
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=${INSTANCE_ID}" \
            --parameters commands='["sudo systemctl restart detechify"]' \
            --comment "Deploy ${IMAGE_TAG}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"

          for i in $(seq 1 36); do
            STATUS=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --details --query 'CommandInvocations[0].Status' --output text || echo "Unknown")
            echo "Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Command failed with status: $STATUS"
              exit 1
            fi
            sleep 5
          done

      - name: Show tag written to SSM (debug)
        run: |
          set -euxo pipefail
          aws ssm get-parameter --with-decryption --name "${SSM_IMAGE_TAG_PARAM}" --query 'Parameter.Value' --output text