services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s

    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        NODE_VERSION: "22"

    environment:
      HOST: 0.0.0.0
      PORT: 3000

      # Graceful shutdown tuning (keep under stop_grace_period)
      SHUTDOWN_GRACE_MS: "28000"
      SHUTDOWN_DRAIN_MS: "20000"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const port=process.env.PORT||3000;const s=net.connect(port,'127.0.0.1',()=>{s.end();process.exit(0);}).on('error',()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - NGINX_USE_SSL=${NGINX_USE_SSL:-false}
    command: >
      sh -c 'set -e;
      CONF=/etc/nginx/templates/plain.conf;
      if [ "$${NGINX_USE_SSL}" = "true" ] && [ -s /etc/nginx/certs/origin.crt ] && [ -s /etc/nginx/certs/origin.key ]; then
        echo "[proxy] Using SSL config";
        CONF=/etc/nginx/templates/ssl.conf;
      else
        echo "[proxy] Using PLAINTEXT config";
      fi;
      cp "$$CONF" /etc/nginx/conf.d/default.conf;
      nginx -g "daemon off;"'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
