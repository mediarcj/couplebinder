LOGIN_MAX:
  description: "Max login attempts allowed in the window"
  required: false
  secret: false
  environments: [dev, prod]

SIGNUP_WINDOW_MS:
  description: "Window in ms for registration attempt tracking (legacy env name)"
  required: false
  secret: false
  environments: [dev, prod]

SIGNUP_MAX:
  description: "Max registrations allowed in the window (legacy env name)"
  required: false
  secret: false
  environments: [dev, prod]

LOGOUT_WINDOW_MS:
  description: "Window in ms for logout tracking"
  required: false
  secret: false
  environments: [dev, prod]

LOGOUT_MAX:
