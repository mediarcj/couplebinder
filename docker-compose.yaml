services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
                   --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
                   --requirepass ${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        NODE_VERSION: "20"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV}
      - HOST=${HOST}
      - PORT=${PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Do NOT publish 3000 to the host; proxy will front it (dev override will re-expose).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/liveness', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    # Mount templates (not conf.d) and certs; the startup command copies the right one in.
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      # Default to PLAINTEXT unless explicitly set to true (prod only when certs exist).
      - NGINX_USE_SSL=${NGINX_USE_SSL:-false}
    command: >
      sh -c 'set -e;
      CONF=/etc/nginx/templates/plain.conf;
      if [ "$${NGINX_USE_SSL}" = "true" ] && [ -s /etc/nginx/certs/origin.crt ] && [ -s /etc/nginx/certs/origin.key ]; then
        echo "[proxy] Using SSL config";
        CONF=/etc/nginx/templates/ssl.conf;
      else
        echo "[proxy] Using PLAINTEXT config";
      fi;
      cp "$$CONF" /etc/nginx/conf.d/default.conf;
      nginx -g "daemon off;"'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data: