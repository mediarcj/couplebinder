# File: .github/workflows/ci.yml
# Description: Continuous integration workflow
# Purpose: Run tests on every push and pull request
# Notes: Does not require real Supabase connection

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Write test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PUBLIC_ORIGIN=http://localhost:3000
          APP_NAME=Detechify (Test)
          SUPABASE_URL=http://localhost:54321
          SUPABASE_ANON_KEY=test_anon_key
          SUPABASE_JWKS={"keys":[{"kty":"oct","k":"dGVzdF9zZWNyZXQ"}]}
          REDIS_URL=redis://localhost:6379
          REDIS_TEST_MODE=memory
          FIREWALL_FAIL_CLOSED=true
          CSRF_SECRET=test_csrf_secret
          JWT_ALLOWED_ALGS=HS256,RS256,ES256
          EOF
      
      - name: Run tests
        run: npm run test:ci

