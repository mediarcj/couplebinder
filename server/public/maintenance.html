<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Detechify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d3748;
        }
        
        .status {
            display: inline-block;
            background: #fed7d7;
            color: #c53030;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        p {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 20px;
        }
        
        .highlight {
            color: #667eea;
            font-weight: 500;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 40px;
            font-size: 0.875rem;
            color: #718096;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 40px 20px;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Detechify</div>
        <div class="status">Maintenance Mode</div>
        <h1>We're making improvements</h1>
        <p>Our team is currently performing scheduled maintenance to enhance your experience.</p>
        <p>We'll be back online shortly<span class="spinner"></span></p>
        <p class="highlight">Thank you for your patience.</p>
        <div class="footer">
            <p>This page will automatically refresh when service is restored.</p>
        </div>
    </div>
    
    <script>
        // Auto-refresh every 30 seconds to check if maintenance is over
        setTimeout(() => {
            window.location.reload();
        }, 30000);
    </script>
</body>
</html>
