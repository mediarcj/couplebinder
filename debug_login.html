<!DOCTYPE html>
<html>
<head>
    <title>Login Debug Test</title>
</head>
<body>
    <h1>Login Debug Test</h1>
    <p>This page helps debug the login form submission issue.</p>
    
    <form id="loginForm">
        <div>
            <label for="loginEmail">Email:</label>
            <input type="email" id="loginEmail" value="mediarcj@gmail.com">
        </div>
        <div>
            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" value="Llkjhasdflkjh123">
        </div>
        <button type="submit">Login</button>
    </form>
    
    <div id="debugOutput"></div>
    
    <script>
        const debugOutput = document.getElementById('debugOutput');
        
        function log(message) {
            console.log(message);
            debugOutput.innerHTML += '<p>' + message + '</p>';
        }
        
        // Test if event listener is attached
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            log('Login form found');
            loginForm.addEventListener('submit', function(e) {
                log('Form submit event triggered - preventDefault called');
                e.preventDefault();
                log('Form submission prevented successfully');
            });
            log('Event listener attached to login form');
        } else {
            log('ERROR: Login form not found');
        }
        
        // Test Supabase client
        if (window.supabase) {
            log('Supabase client available');
        } else {
            log('ERROR: Supabase client not available');
        }
    </script>
</body>
</html>
