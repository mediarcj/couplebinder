name: Nightly Maintenance

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual changes)'
        required: false
        default: 'false'
        type: boolean

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run maintenance tasks
        run: |
          cd server
          node -e "
          const { supabaseAdmin } = require('./utils/supabaseClient');
          const logger = require('./utils/logger');
          
          async function runMaintenance() {
            console.log('Starting nightly maintenance tasks...');
            console.log('Dry run mode:', process.env.DRY_RUN === 'true');
            
            try {
              // 1. Clean up old outbox events (older than 7 days)
              console.log('Cleaning up old outbox events...');
              const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
              
              if (process.env.DRY_RUN === 'true') {
                const { count } = await supabaseAdmin
                  .from('outbox_events')
                  .select('*', { count: 'exact', head: true })
                  .lt('created_at', sevenDaysAgo);
                console.log('Would delete', count, 'old outbox events');
              } else {
                const { error } = await supabaseAdmin
                  .from('outbox_events')
                  .delete()
                  .lt('created_at', sevenDaysAgo);
                
                if (error) {
                  console.error('Failed to clean up outbox events:', error.message);
                } else {
                  console.log('Successfully cleaned up old outbox events');
                }
              }
              
              // 2. Clean up old idempotency keys (older than 24 hours)
              console.log('Cleaning up old idempotency keys...');
              const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
              
              if (process.env.DRY_RUN === 'true') {
                const { count } = await supabaseAdmin
                  .from('idempotency_keys')
                  .select('*', { count: 'exact', head: true })
                  .lt('created_at', oneDayAgo);
                console.log('Would delete', count, 'old idempotency keys');
              } else {
                const { error } = await supabaseAdmin
                  .from('idempotency_keys')
                  .delete()
                  .lt('created_at', oneDayAgo);
                
                if (error) {
                  console.error('Failed to clean up idempotency keys:', error.message);
                } else {
                  console.log('Successfully cleaned up old idempotency keys');
                }
              }
              
              // 3. Clean up old audit logs (older than 30 days)
              console.log('Cleaning up old audit logs...');
              const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
              
              if (process.env.DRY_RUN === 'true') {
                const { count } = await supabaseAdmin
                  .from('audit_logs')
                  .select('*', { count: 'exact', head: true })
                  .lt('created_at', thirtyDaysAgo);
                console.log('Would delete', count, 'old audit logs');
              } else {
                const { error } = await supabaseAdmin
                  .from('audit_logs')
                  .delete()
                  .lt('created_at', thirtyDaysAgo);
                
                if (error) {
                  console.error('Failed to clean up audit logs:', error.message);
                } else {
                  console.log('Successfully cleaned up old audit logs');
                }
              }
              
              // 4. Get system statistics
              console.log('Collecting system statistics...');
              
              // Outbox stats
              const { data: outboxStats } = await supabaseAdmin
                .from('outbox_events')
                .select('status')
                .gte('created_at', new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString());
              
              const outboxCounts = outboxStats.reduce((acc, event) => {
                acc[event.status] = (acc[event.status] || 0) + 1;
                return acc;
              }, {});
              
              console.log('Outbox events (last 24h):', outboxCounts);
              
              // Profile update stats
              const { count: profileUpdates } = await supabaseAdmin
                .from('profiles')
                .select('*', { count: 'exact', head: true })
                .gte('updated_at', new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString());
              
              console.log('Profile updates (last 24h):', profileUpdates);
              
              // User stats
              const { count: totalUsers } = await supabaseAdmin
                .from('profiles')
                .select('*', { count: 'exact', head: true });
              
              console.log('Total users:', totalUsers);
              
              console.log('Nightly maintenance completed successfully');
              
            } catch (error) {
              console.error('Maintenance task failed:', error.message);
              process.exit(1);
            }
          }
          
          runMaintenance().catch(console.error);
          "

      - name: Create maintenance report
        if: always()
        run: |
          echo "## Nightly Maintenance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ env.DRY_RUN == 'true' && 'Dry Run' || 'Production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tasks Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cleaned up old outbox events (>7 days)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cleaned up old idempotency keys (>24 hours)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cleaned up old audit logs (>30 days)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Collected system statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Review system statistics for anomalies" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor outbox event processing" >> $GITHUB_STEP_SUMMARY
          echo "- Check for any failed maintenance tasks" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    needs: maintenance
    if: github.event_name == 'schedule' # Only run on schedule, not manual dispatch
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Run security audit
        run: |
          cd server
          npm audit --audit-level=moderate

      - name: Check for known vulnerabilities
        run: |
          cd server
          npm audit --json > audit-results.json
          
          # Check if there are any high or critical vulnerabilities
          HIGH_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
          
          echo "High severity vulnerabilities: $HIGH_VULNS"
          echo "Critical severity vulnerabilities: $CRITICAL_VULNS"
          
          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "⚠️ Security vulnerabilities detected!"
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found"
          fi

      - name: Create security report
        if: always()
        run: |
          echo "## Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f audit-results.json ]; then
            HIGH_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
            CRITICAL_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
            MODERATE_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.moderate // 0')
            LOW_VULNS=$(cat audit-results.json | jq '.metadata.vulnerabilities.low // 0')
            
            echo "### Vulnerability Summary:" >> $GITHUB_STEP_SUMMARY
            echo "- 🔴 Critical: $CRITICAL_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "- 🟠 High: $HIGH_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 Moderate: $MODERATE_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "- 🟢 Low: $LOW_VULNS" >> $GITHUB_STEP_SUMMARY
          fi
