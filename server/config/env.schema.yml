# --------------------------------------------------------------------
# Maintenance mode
# --------------------------------------------------------------------
MAINTENANCE_DEFAULT:
  description: "Default maintenance mode state on startup"
  required: false
  secret: false
  environments: [dev, prod]

MAINTENANCE_ALLOWLIST:
  description: "Comma-separated list of IPs allowed during maintenance"
  required: false
  secret: false
  environments: [dev, prod]

MAINTENANCE_RETRY_AFTER:
  description: "Retry-After header during maintenance (seconds)"
  required: false
  secret: false
  environments: [dev, prod]

MAINTENANCE_PAGE:
  description: "Path or ID of maintenance page template"
  required: false
  secret: false
  environments: [dev, prod]

MAINTENANCE_MESSAGE:
  description: "Maintenance mode message shown to users"
  required: false
  secret: false
  environments: [dev, prod]

MAINTENANCE_KEY:
  description: "Key used to sign or control maintenance state"
  required: false
  secret: true
  environments: [dev, prod]

MAINTENANCE_BYPASS_TOKEN:
  description: "Secret token granting maintenance bypass access"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Rate limiting / abuse protection
# --------------------------------------------------------------------
APP_LIMITERS_ENABLED:
  description: "Enable global app-level limiters"
  required: false
  secret: false
  environments: [dev, prod]

LOCAL_LIMITERS_ENABLED:
  description: "Enable local in-process limiters"
  required: false
  secret: false
  environments: [dev, prod]

RATE_LIMIT_ENABLED:
  description: "Enable rate limiting"
  required: false
  secret: false
  environments: [dev, prod]

RATE_LIMIT_MAX:
  description: "Max number of requests per IP per window"
  required: false
  secret: false
  environments: [dev, prod]

RATE_LIMIT_WINDOW_MS:
  description: "Rate limit window size in ms"
  required: false
  secret: false
  environments: [dev, prod]

SKIP_RATE_LIMIT_IN_DEV:
  description: "Skip rate limiting in development"
  required: false
  secret: false
  environments: [dev]

SKIP_RATE_LIMIT_IN_TEST:
  description: "Skip rate limiting in tests"
  required: false
  secret: false
  environments: [test]

MAX_SUBMISSIONS:
  description: "Max submissions allowed per unit of work (e.g. per day)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Text / form limits
# --------------------------------------------------------------------
TEXT_MAX_LENGTH:
  description: "Max allowed text length in user input"
  required: false
  secret: false
  environments: [dev, prod]

TEXT_MIN_LENGTH:
  description: "Minimum required text length in user input"
  required: false
  secret: false
  environments: [dev, prod]

SIGNUP_MAX:
  description: "Maximum allowed registrations within a window (legacy name, kept for backward compatibility)"
  required: false
  secret: false
  environments: [dev, prod]

LOGIN_WINDOW_MS:
  description: "Window in ms for login attempt tracking"
  required: false
  secret: false
  environments: [dev, prod]

SIGNUP_WINDOW_MS:
  description: "Window in ms for registration attempt tracking (legacy name, kept for backward compatibility)"
  required: false
  secret: false
  environments: [dev, prod]

LOGOUT_MAX:
  description: "Maximum logout actions tracked in a window"
  required: false
  secret: false
  environments: [dev, prod]

LOGOUT_WINDOW_MS:
  description: "Window in ms for logout tracking"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Queues / background jobs
# --------------------------------------------------------------------
REPAIR_QUEUE_ENABLED:
  description: "Enable background repair queue"
  required: false
  secret: false
  environments: [dev, prod]

REPAIR_QUEUE_NAME:
  description: "Name of the repair job queue"
  required: false
  secret: false
  environments: [dev, prod]

REPAIR_QUEUE_CONCURRENCY:
  description: "Number of repair jobs processed in parallel"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Feature flags
# --------------------------------------------------------------------
FEATURE_ARCHIVE_RECEIPTS:
  description: "Enable archive receipts feature"
  required: false
  secret: false
  environments: [dev, prod]

FEATURE_ARCHIVE_RECEIPTS_TABLE:
  description: "Table or resource used to store archived receipts"
  required: false
  secret: false
  environments: [dev, prod]

CONFIG_ENV_AUDIT:
  description: "Enable extra logging/auditing of environment config"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Ops / health / observability
# --------------------------------------------------------------------
OPS_HEALTH_TOKEN:
  description: "Secret token used to protect internal health endpoints"
  required: false
  secret: true
  environments: [dev, prod]

OPS_HEALTH_IPS:
  description: "Comma-separated IPs allowed to hit ops health endpoints"
  required: false
  secret: false
  environments: [dev, prod]

HEALTH_PUBLIC:
  description: "Whether basic health endpoint is publicly accessible"
  required: false
  secret: false
  environments: [dev, prod]

OPS_DB_PROBE_TABLE:
  description: "Table name used for DB health probe"
  required: false
  secret: false
  environments: [dev, prod]

OPS_DB_PROBE_RPC:
  description: "RPC/function used for DB health probe"
  required: false
  secret: false
  environments: [dev, prod]

LOG_LEVEL:
  description: "Logging level (debug, info, warn, error)"
  required: false
  secret: false
  environments: [dev, prod]

SHUTDOWN_GRACE_MS:
  description: "Grace period in ms for graceful shutdowns"
  required: false
  secret: false
  environments: [dev, prod]