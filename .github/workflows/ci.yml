# File: .github/workflows/ci.yml
# Description: Continuous integration workflow
# Purpose: Run tests on every push and pull request
# Notes: Does not require real Supabase connection

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Write .env.test from example if missing
        run: |
          if [ ! -f .env.test ] && [ -f .env.test.example ]; then
            cp .env.test.example .env.test
          fi
      
      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test

