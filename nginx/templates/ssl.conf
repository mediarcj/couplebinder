# For /etc/nginx/conf.d/default.conf (included in nginx.conf http{} context)
# Note: map blocks must be at http{} level, not inside server{}
# Docker Nginx includes this entire file inside http{} context automatically

map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=30s;

    location /health/ {
        proxy_pass http://app:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_read_timeout 60s;
    }
}