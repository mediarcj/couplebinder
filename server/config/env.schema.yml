STRIPE_PUBLISHABLE_KEY_TEST:
  description: "Stripe test mode publishable key"
  required: false
  secret: false
  environments: [dev, test]

STRIPE_WEBHOOK_SECRET_TEST:
  description: "Stripe test mode webhook signing secret"
  required: false
  secret: true
  environments: [dev, test]

STRIPE_PRICE_RESUME_ONE_TIME_TEST:
  description: "Stripe test mode price ID for one-time resume purchase"
