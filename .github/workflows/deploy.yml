name: Build and Deploy to Prod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.ECR_REPO }}
      SSM_IMAGE_TAG_PARAM: ${{ secrets.SSM_IMAGE_TAG_PARAM }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          docker build --platform linux/amd64 -t $ECR_REPO:$IMAGE_TAG .
          docker tag $ECR_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

      - name: Update SSM param with the new image tag
        run: |
          aws ssm put-parameter --name "$SSM_IMAGE_TAG_PARAM" \
            --type SecureString --value "$IMAGE_TAG" --overwrite

      - name: Restart service on the instance (SSM)
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${INSTANCE_ID}" \
            --parameters commands='["sudo systemctl restart detechify"]' \
            --comment "Deploy $IMAGE_TAG" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"