# server/config/env.schema.yml
# Schema for application environment variables.
# Fields:
#   description: What this variable is for (short).
#   required:    Whether the app should refuse to start without it for that env.
#   secret:      Whether it contains sensitive data (treat carefully).
#   environments: List of environments that should define this key (dev/prod/test).

# --------------------------------------------------------------------
# Core app metadata / identity
# --------------------------------------------------------------------
APP_NAME:
  description: "Human-readable app name (e.g. Couplebinder)"
  required: true
  secret: false
  environments: [dev, prod]

APP_DESCRIPTION:
  description: "Short description of the app"
  required: false
  secret: false
  environments: [dev, prod]

APP_VERSION:
  description: "Application version string for logging and assets"
  required: false
  secret: false
  environments: [dev, prod]

ASSET_VERSION:
  description: "Cache-busting token for static assets"
  required: false
  secret: false
  environments: [dev, prod]

IMAGE_TAG:
  description: "Docker image tag or build identifier"
  required: false
  secret: false
  environments: [dev, prod]

NODE_ENV:
  description: "Node environment (development, production, test)"
  required: true
  secret: false
  environments: [dev, prod, test]

PORT:
  description: "HTTP server port"
  required: true
  secret: false
  environments: [dev, prod]

HOST:
  description: "Host/IP to bind the HTTP server"
  required: false
  secret: false
  environments: [dev, prod]

PUBLIC_ORIGIN:
  description: "Public base URL of the app (scheme + host + optional port)"
  required: true
  secret: false
  environments: [dev, prod]

BASE_DOMAIN:
  description: "Base domain (e.g. couplebinder.com)"
  required: true
  secret: false
  environments: [dev, prod]

APP_SUBDOMAIN:
  description: "App subdomain (e.g. app)"
  required: false
  secret: false
  environments: [dev, prod]

CANONICAL_HOST:
  description: "Canonical host name for redirects and canonical links"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Cookies & auth cookies
# --------------------------------------------------------------------
AUTH_COOKIE_NAME:
  description: "Primary auth cookie name"
  required: true
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_BASENAME:
  description: "Base name for auth cookies before environment suffixes"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_ALIASES:
  description: "Comma-separated list of legacy auth cookie names accepted"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_DOMAIN:
  description: "Domain attribute for auth cookies"
  required: false
  secret: false
  environments: [dev, prod]

LEGACY_COOKIE_DOMAIN:
  description: "Legacy cookie domain accepted during migrations"
  required: false
  secret: false
  environments: [dev, prod]

COOKIE_SAMESITE:
  description: "SameSite policy for cookies (Strict, Lax, None)"
  required: true
  secret: false
  environments: [dev, prod]

COOKIE_SECURE:
  description: "Whether cookies should use Secure flag"
  required: true
  secret: false
  environments: [dev, prod]

COOKIE_SET_ATTEMPTS:
  description: "Max attempts to set cookies before giving up"
  required: false
  secret: false
  environments: [dev, prod]

COOKIE_SET_MAX:
  description: "Max number of cookies that can be set per response"
  required: false
  secret: false
  environments: [dev, prod]

COOKIE_SET_WINDOW_MS:
  description: "Time window in ms used for cookie set rate limiting"
  required: false
  secret: false
  environments: [dev, prod]

SESSION_SECRET:
  description: "Secret used for signing sessions or server-side tokens"
  required: true
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# CSRF / security headers / JWT
# --------------------------------------------------------------------
CSRF_COOKIE_NAME:
  description: "Name of CSRF cookie"
  required: true
  secret: false
  environments: [dev, prod]

CSRF_HEADER_NAME:
  description: "Header name carrying the CSRF token"
  required: true
  secret: false
  environments: [dev, prod]

CSRF_SECRET:
  description: "Secret used for generating/verifying CSRF tokens"
  required: true
  secret: true
  environments: [dev, prod]

JWT_CLOCK_SKEW_SEC:
  description: "Allowed JWT clock skew in seconds"
  required: false
  secret: false
  environments: [dev, prod]

JWT_ALLOWED_ALGS:
  description: "Comma-separated list of allowed JWT signing algorithms"
  required: false
  secret: false
  environments: [dev, prod]

ENFORCE_HTTPS:
  description: "Enforce HTTPS in redirects and security checks"
  required: false
  secret: false
  environments: [dev, prod]

TRUST_PROXY_HOPS:
  description: "Number of proxy hops to trust (Express trust proxy setting)"
  required: false
  secret: false
  environments: [dev, prod]

NGINX_USE_SSL:
  description: "Whether Nginx is terminating SSL in front of the app"
  required: false
  secret: false
  environments: [dev, prod]

X_CLIENT_INFO:
  description: "Client info header name used for logging/debugging"
  required: false
  secret: false
  environments: [dev, prod]

FIREWALL_FAIL_CLOSED:
  description: "If true, firewall errors default to blocking traffic"
  required: false
  secret: false
  environments: [dev, prod]

IP_BLOCKLIST:
  description: "Comma-separated list of blocked IPs or CIDR ranges"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# CORS / origins
# --------------------------------------------------------------------
ALLOWED_ORIGINS:
  description: "Comma-separated list of allowed origins"
  required: false
  secret: false
  environments: [dev, prod]

CORS_ORIGINS:
  description: "CORS origins list (if separate from ALLOWED_ORIGINS)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Database / Redis / storage
# --------------------------------------------------------------------
DB_PROVIDER:
  description: "Database provider identifier (e.g. supabase)"
  required: true
  secret: false
  environments: [dev, prod]

SUPABASE_DB_URL:
  description: "Supabase postgres connection string"
  required: true
  secret: true
  environments: [dev, prod]

REDIS_URL:
  description: "Redis connection URL"
  required: false
  secret: true
  environments: [dev, prod]

REDIS_HOST:
  description: "Redis host (if not using REDIS_URL)"
  required: false
  secret: false
  environments: [dev, prod]

REDIS_PORT:
  description: "Redis port (if not using REDIS_URL)"
  required: false
  secret: false
  environments: [dev, prod]

REDIS_PASSWORD:
  description: "Redis password (if not using REDIS_URL)"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Supabase / auth integration
# --------------------------------------------------------------------
SUPABASE_URL:
  description: "Supabase project URL"
  required: true
  secret: false
  environments: [dev, prod]

SUPABASE_ANON_KEY:
  description: "Supabase anon key for client operations"
  required: true
  secret: true
  environments: [dev, prod]

SUPABASE_SERVICE_ROLE_KEY:
  description: "Supabase service role key for privileged server operations"
  required: true
  secret: true
  environments: [dev, prod]

SUPABASE_JWT_SECRET:
  description: "Secret used for Supabase JWTs"
  required: true
  secret: true
  environments: [dev, prod]

SUPABASE_JWKS_URL:
  description: "URL of JWKS endpoint used to validate Supabase JWTs"
  required: false
  secret: false
  environments: [dev, prod]

SUPABASE_ISSUER:
  description: "Expected issuer claim for Supabase JWTs"
  required: false
  secret: false
  environments: [dev, prod]

SUPABASE_EXPECTED_AUD:
  description: "Expected audience claim for Supabase JWTs"
  required: false
  secret: false
  environments: [dev, prod]

SELF_HOST_SUPABASE_JS:
  description: "Whether Supabase JS client is self-hosted"
  required: false
  secret: false
  environments: [dev, prod]

ALLOW_LEGACY_LOGIN:
  description: "Allow legacy login flows / cookies"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_DEBUG:
  description: "Enable verbose auth logging and debug output"
  required: false
  secret: false
  environments: [dev, prod]

