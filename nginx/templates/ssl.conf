# For /etc/nginx/conf.d/default.conf (included in nginx.conf http{} context)
# Note: map blocks must be at http{} level, not inside server{}
# Docker Nginx includes this entire file inside http{} context automatically

# nginx/templates/ssl.conf
# Loaded inside the global http{} context by default

# Preserve original scheme if CF sets it
map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Trust Cloudflare and restore real client IPs
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --- Pretty-ish JSON access logs (single line; human + machine friendly) ---
log_format app_json escape=json
  '{'
    '"level":"info",'
    '"ts":"$time_iso8601",'
    '"event":"proxy.access",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"host":"$host",'
    '"scheme":"$scheme",'
    '"proto":"$server_protocol",'
    '"client_ip":"$realip_remote_addr",'
    '"referrer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$http_x_request_id",'
    '"app_request_id":"$sent_http_x_request_id"'
  '}';

# Note: in the official nginx image, these files are symlinks to stdout/stderr
access_log /var/log/nginx/access.log app_json;
error_log  /var/log/nginx/error.log  warn;

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name detechify.com app.detechify.com _;
    return 301 https://$host$request_uri;
}

# --- HTTPS origin for Cloudflare ---
server {
    listen 443 ssl;
    http2 on;  # replaces deprecated "listen ... http2"
    server_name detechify.com app.detechify.com _;

    # Cloudflare Origin certs (mounted read-only)
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Basic hardening
    server_tokens off;

    # Docker DNS for upstream name resolution
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Health paths (Cloudflare WAF allows these only with your secret header)
    location /health/ {
        proxy_pass http://app:3000;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Static assets → proxy but avoid temp files; cache long
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_request_buffering off;   # don't buffer request to disk
        proxy_max_temp_file_size 0;    # don't write large responses to temp files
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else → app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_read_timeout 60s;
    }
}