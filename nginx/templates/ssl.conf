# nginx/templates/ssl.conf
# HTTPS origin for Cloudflare + secure Stripe webhook pass-through

error_log /var/log/nginx/error.log warn;

log_format app_json escape=json
  '{'
    '"level":"info",'
    '"ts":"$time_iso8601",'
    '"event":"proxy.access",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":"$request_time",'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"host":"$host",'
    '"scheme":"$scheme",'
    '"proto":"$server_protocol",'
    '"request_id":"$upstream_http_x_request_id",'
    '"app_request_id":"$sent_http_x_request_id"'
  '}';

access_log /var/log/nginx/access.log app_json;

# Prefer Cloudflare's scheme hint when present, else honor incoming XFP, else fallback to local scheme
map $http_cf_visitor $cf_scheme {
    default "";
    ~*\"scheme\":\"https\" https;
    ~*\"scheme\":\"http\"  http;
}

map $http_x_forwarded_proto $xfp_in {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# If Cloudflare says https, trust it; otherwise use prior logic
map "$cf_scheme:$xfp_in" $xfp {
    default $xfp_in;
    ~*^https: https;
}

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name couplebinder.com app.couplebinder.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- HTTPS origin for Cloudflare ---
server {
    listen 443 ssl;
    http2 on;
    server_name couplebinder.com app.couplebinder.com;

    # Accept larger upstream response headers (e.g., long Set-Cookie with JWT)
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # Optional: extra headroom for incoming request headers
    large_client_header_buffers 8 32k;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check
    location /health/ {
        proxy_pass http://app:3000;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Stripe webhook (no buffering)
    location = /api/stripe/webhook {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Static assets
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 60s;
        # Pass through all headers from app (including CSP, security headers)
        proxy_pass_header Content-Security-Policy;
        proxy_pass_header X-Content-Type-Options;
        proxy_pass_header X-Frame-Options;
        proxy_pass_header X-XSS-Protection;
        proxy_pass_header Referrer-Policy;
        # Express is the single authority for version-aware static cache headers.
    }

    # Default
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $xfp;
        proxy_read_timeout 60s;
        # Pass through all security headers from app
        proxy_pass_header Content-Security-Policy;
        proxy_pass_header X-Content-Type-Options;
        proxy_pass_header X-Frame-Options;
        proxy_pass_header X-XSS-Protection;
        proxy_pass_header Referrer-Policy;
    }
}
