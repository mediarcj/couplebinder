# File: server/config/env.schema.yml
# Description: Schema for application + infra environment variables (repo inventory).
# Notes:
# - "required: true" reflects what server/config/index.js validateConfig() actually enforces.
# - Some requirements are conditional (handled by env-doctor.js):
#   - DB_PROVIDER=postgres => SUPABASE_DB_URL required
#   - AUTH_SET_COOKIE_ENFORCE_TURNSTILE=true => TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY required
#   - STORAGE_PROVIDER=s3 => STORAGE_S3_BUCKET required; (STORAGE_S3_REGION or AWS_REGION) required
#   - If Stripe prices are configured for the active mode => PUBLIC_ORIGIN required
#
# Fields:
#   description: What this variable is for (short).
#   required:    Whether the app should refuse to start without it for that env.
#   secret:      Whether it contains sensitive data (treat carefully).
#   environments: List of environments that should define this key (dev/prod/test).

# --------------------------------------------------------------------
# Core runtime
# --------------------------------------------------------------------
NODE_ENV:
  description: "Node environment (development, production, test)"
  required: true
  secret: false
  environments: [dev, prod, test]

PORT:
  description: "HTTP server port"
  required: true
  secret: false
  environments: [dev, prod]

HOST:
  description: "Host/IP to bind the HTTP server"
  required: true
  secret: false
  environments: [dev, prod]

PUBLIC_ORIGIN:
  description: "Public base URL of the app (scheme + host + optional port). Required when Stripe prices are configured."
  required: false
  secret: false
  environments: [dev, prod]

CANONICAL_HOST:
  description: "Canonical host name for redirects and canonical links"
  required: false
  secret: false
  environments: [dev, prod]

TRUST_PROXY_HOPS:
  description: "Number of proxy hops to trust (Express trust proxy setting)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Infra (Docker/Nginx)
# --------------------------------------------------------------------
NGINX_USE_SSL:
  description: "Infra: Nginx proxy toggle to select SSL vs plaintext template at container boot (used by docker-compose/nginx command)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# App branding / metadata
# --------------------------------------------------------------------
APP_NAME:
  description: "Human-readable app name (e.g. Couplebinder)"
  required: false
  secret: false
  environments: [dev, prod]

APP_DESCRIPTION:
  description: "Short description of the app"
  required: false
  secret: false
  environments: [dev, prod]

APP_VERSION:
  description: "Application version string for logging and assets"
  required: false
  secret: false
  environments: [dev, prod]

ASSET_VERSION:
  description: "Cache-busting token for static assets"
  required: false
  secret: false
  environments: [dev, prod]

IMAGE_TAG:
  description: "Docker image tag or build identifier"
  required: false
  secret: false
  environments: [dev, prod]

BASE_DOMAIN:
  description: "Base domain (e.g. couplebinder.com)"
  required: false
  secret: false
  environments: [dev, prod]

APP_SUBDOMAIN:
  description: "App subdomain (e.g. app)"
  required: false
  secret: false
  environments: [dev, prod]

X_CLIENT_INFO:
  description: "Client info header value used for Supabase client init and diagnostics"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Cookies / auth cookies
# --------------------------------------------------------------------
AUTH_COOKIE_NAME:
  description: "Primary auth cookie name (legacy). Prefer AUTH_COOKIE_BASENAME when using __Host- rules."
  required: false
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_BASENAME:
  description: "Base name for auth cookies before __Host- handling (server strips __Host- prefix internally)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_ALIASES:
  description: "Comma-separated list of legacy auth cookie names accepted"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_COOKIE_DOMAIN:
  description: "Domain attribute for auth cookies (generally leave empty when using __Host- cookies)"
  required: false
  secret: false
  environments: [dev, prod]

LEGACY_COOKIE_DOMAIN:
  description: "Legacy cookie domain used only for clearing old cookies during migrations"
  required: false
  secret: false
  environments: [dev, prod]

COOKIE_SAMESITE:
  description: "SameSite policy for cookies (Strict or Lax). Defaults to Lax."
  required: false
  secret: false
  environments: [dev, prod]

COOKIE_SECURE:
  description: "Whether cookies should use Secure flag (true/false). Defaults to auto-detect."
  required: false
  secret: false
  environments: [dev, prod]

ALLOW_LEGACY_LOGIN:
  description: "Allow legacy login flows / cookies"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_DEBUG:
  description: "Enable verbose auth logging and debug output"
  required: false
  secret: false
  environments: [dev, prod]

PASSWORD_RESET_REDIRECT_URL:
  description: "Optional override for forgot-password redirect URL"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_SENTINEL_MS:
  description: "Logout sentinel cookie TTL in ms (0 disables sentinel fallback)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_FRESH_GRACE_SEC:
  description: "Fresh login grace seconds when watermark is unavailable (default 20)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_ROLE_LEGACY_APP_METADATA_ROLE:
  description: "Temporarily accept verified app_metadata.role product roles (default false)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_ROLE_LEGACY_TOP_LEVEL_USER_ROLE:
  description: "Temporarily accept verified top-level user_role product roles (default false)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_ROLE_SUPER_USER_AS_ADMIN:
  description: "Temporarily normalize verified super_user to admin-equivalent (default false)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_SET_COOKIE_ENFORCE_LOCKOUT:
  description: "If true, enforce lockout checks on /auth/set-cookie (defaults to true in production)"
  required: false
  secret: false
  environments: [dev, prod]

AUTH_SET_COOKIE_ENFORCE_TURNSTILE:
  description: "If true, enforce Turnstile on /auth/set-cookie (requires Turnstile keys)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# CSRF / security
# --------------------------------------------------------------------
CSRF_COOKIE_NAME:
  description: "Name of CSRF cookie"
  required: false
  secret: false
  environments: [dev, prod]

CSRF_HEADER_NAME:
  description: "Header name carrying the CSRF token"
  required: false
  secret: false
  environments: [dev, prod]

CSRF_SECRET:
  description: "Secret used for generating/verifying CSRF tokens"
  required: false
  secret: true
  environments: [dev, prod]

SESSION_SECRET:
  description: "Secret used for signing sessions or server-side tokens"
  required: false
  secret: true
  environments: [dev, prod]

ENFORCE_HTTPS:
  description: "Enforce HTTPS in redirects and security checks"
  required: false
  secret: false
  environments: [dev, prod]

FIREWALL_FAIL_CLOSED:
  description: "If true, firewall errors default to blocking traffic"
  required: false
  secret: false
  environments: [dev, prod]

IP_BLOCKLIST:
  description: "Comma-separated list of blocked IPs or CIDR ranges"
  required: false
  secret: false
  environments: [dev, prod]

ALLOWED_ORIGINS:
  description: "Comma-separated list of allowed origins"
  required: false
  secret: false
  environments: [dev, prod]

CORS_ORIGINS:
  description: "CORS origins list (if separate from ALLOWED_ORIGINS)"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# JWT verification (validateConfig requires these three)
# --------------------------------------------------------------------
SUPABASE_JWKS_URL:
  description: "JWKS endpoint used to validate Supabase JWTs"
  required: true
  secret: false
  environments: [dev, prod]

SUPABASE_ISSUER:
  description: "Expected issuer claim for Supabase JWTs"
  required: true
  secret: false
  environments: [dev, prod]

SUPABASE_EXPECTED_AUD:
  description: "Expected audience claim for Supabase JWTs"
  required: true
  secret: false
  environments: [dev, prod]

JWT_CLOCK_SKEW_SEC:
  description: "Allowed JWT clock skew in seconds (default 60)"
  required: false
  secret: false
  environments: [dev, prod]

JWT_ALLOWED_ALGS:
  description: "Comma-separated list of allowed JWT signing algorithms (if used elsewhere)"
  required: false
  secret: false
  environments: [dev, prod]

SUPABASE_JWT_SECRET:
  description: "Supabase JWT secret (only needed for HS256 setups or internal tooling; RS256 JWKS verification does not require it)"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Database selection
# --------------------------------------------------------------------
DB_PROVIDER:
  description: "Database provider: supabase-http (default) or postgres"
  required: false
  secret: false
  environments: [dev, prod]

SUPABASE_URL:
  description: "Supabase project URL (required for DB_PROVIDER=supabase-http)"
  required: true
  secret: false
  environments: [dev, prod]

SUPABASE_DB_URL:
  description: "Postgres connection string (required only when DB_PROVIDER=postgres)"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Supabase client keys (server + client)
# --------------------------------------------------------------------
SUPABASE_ANON_KEY:
  description: "Supabase anon key for client operations and (sometimes) JWKS access"
  required: false
  secret: true
  environments: [dev, prod]

SUPABASE_SERVICE_ROLE_KEY:
  description: "Supabase service role key for privileged server operations"
  required: false
  secret: true
  environments: [dev, prod]

SELF_HOST_SUPABASE_JS:
  description: "Whether Supabase JS client is self-hosted"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# Redis
# --------------------------------------------------------------------
REDIS_URL:
  description: "Redis connection URL"
  required: false
  secret: true
  environments: [dev, prod]

REDIS_HOST:
  description: "Redis host (if not using REDIS_URL)"
  required: false
  secret: false
  environments: [dev, prod]

REDIS_PORT:
  description: "Redis port (if not using REDIS_URL)"
  required: false
  secret: false
  environments: [dev, prod]

REDIS_PASSWORD:
  description: "Redis password (if not using REDIS_URL)"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Turnstile
# --------------------------------------------------------------------
TURNSTILE_SITE_KEY:
  description: "Cloudflare Turnstile site key (public)"
  required: false
  secret: false
  environments: [dev, prod]

TURNSTILE_SECRET_KEY:
  description: "Cloudflare Turnstile secret key"
  required: false
  secret: true
  environments: [dev, prod]

# --------------------------------------------------------------------
# Storage
# --------------------------------------------------------------------
STORAGE_PROVIDER:
  description: "Storage provider: local or s3"
  required: false
  secret: false
  environments: [dev, prod]

STORAGE_S3_BUCKET:
  description: "S3 bucket name (required when STORAGE_PROVIDER=s3)"
  required: false
  secret: false
  environments: [dev, prod]

STORAGE_S3_REGION:
  description: "S3 region override; if empty, config uses AWS_REGION fallback (then default us-west-2)"
  required: false
  secret: false
  environments: [dev, prod]

AWS_REGION:
  description: "AWS region fallback used when STORAGE_S3_REGION is not set"
  required: false
  secret: false
  environments: [dev, prod]

STORAGE_S3_BASE_PATH:
  description: "Base path/prefix inside bucket (default binders)"
  required: false
  secret: false
  environments: [dev, prod]

STORAGE_S3_PUBLIC_BASE_URL:
  description: "Optional explicit public base URL ONLY if bucket is genuinely public"
  required: false
  secret: false
  environments: [dev, prod]

# --------------------------------------------------------------------
# App limits / input limits (validateConfig requires these)
# --------------------------------------------------------------------
TEXT_MIN_LENGTH:
  description: "Minimum required text length in user input"
  required: true
  secret: false
